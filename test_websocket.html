<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test - DEAC Network</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
        .message { background-color: #f8f9fa; padding: 10px; margin: 5px 0; border-left: 3px solid #007bff; }
        button { padding: 10px 20px; margin: 5px; }
        #messages { max-height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; }
    </style>
</head>
<body>
    <h1>🌐 WebSocket Test - DEAC Network</h1>
    
    <div id="status" class="status disconnected">
        Status: Disconnected
    </div>
    
    <div>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="sendTestMessage()">Send Test Message</button>
    </div>
    
    <h3>Messages:</h3>
    <div id="messages"></div>
    
    <script>
        let ws = null;
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        
        function updateStatus(connected, message) {
            statusDiv.className = `status ${connected ? 'connected' : 'disconnected'}`;
            statusDiv.textContent = `Status: ${message}`;
        }
        
        function addMessage(type, data) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = `
                <strong>[${new Date().toLocaleTimeString()}] ${type}:</strong><br>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addMessage('INFO', 'Already connected');
                return;
            }
            
            updateStatus(false, 'Connecting...');
            
            try {
                ws = new WebSocket('ws://localhost:8000/ws/deac-network');
                
                ws.onopen = function(event) {
                    updateStatus(true, 'Connected to DEAC Network');
                    addMessage('CONNECTED', 'WebSocket connection established');
                };
                
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        addMessage('RECEIVED', data);
                    } catch (e) {
                        addMessage('RECEIVED (RAW)', event.data);
                    }
                };
                
                ws.onclose = function(event) {
                    updateStatus(false, 'Disconnected');
                    addMessage('DISCONNECTED', { code: event.code, reason: event.reason });
                };
                
                ws.onerror = function(error) {
                    updateStatus(false, 'Connection Error');
                    addMessage('ERROR', 'WebSocket error occurred');
                };
                
            } catch (error) {
                updateStatus(false, 'Failed to connect');
                addMessage('ERROR', error.message);
            }
        }
        
        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }
        
        function sendTestMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('ERROR', 'Not connected');
                return;
            }
            
            const testMessage = {
                type: 'test_message',
                message: 'Hello DEAC Network!',
                timestamp: new Date().toISOString()
            };
            
            ws.send(JSON.stringify(testMessage));
            addMessage('SENT', testMessage);
        }
        
        // Auto-connect on page load
        window.onload = function() {
            connect();
        };
    </script>
</body>
</html>
