# Aether AI DEAC - Docker Configuration

version: '3.8'

services:
  # Frontend - React Application
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - aether-network

  # Backend - FastAPI Application  
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aether_user:aether_pass@postgres:5432/aether_db
      - REDIS_URL=redis://redis:6379/0
      - VECTOR_DB_URL=http://chromadb:8000
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
      - chromadb
    networks:
      - aether-network
    runtime: nvidia  # Enable GPU access
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=aether_db
      - POSTGRES_USER=aether_user
      - POSTGRES_PASSWORD=aether_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/postgres:/backup
    ports:
      - "5432:5432"
    networks:
      - aether-network

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - aether-network

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8001:8000"
    networks:
      - aether-network

  # Celery Worker for Background Tasks
  celery:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    command: celery -A backend.main:celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://aether_user:aether_pass@postgres:5432/aether_db
      - REDIS_URL=redis://redis:6379/0
      - VECTOR_DB_URL=http://chromadb:8000
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
      - chromadb
    networks:
      - aether-network
    runtime: nvidia

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - aether-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - aether-network

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - aether-network

networks:
  aether-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chromadb_data:
  prometheus_data:
  grafana_data: